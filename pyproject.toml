[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "metaheuristic-optimization-labs"
version = "1.0.0"
description = "Metaheuristic optimization experiments on QAPLIB and Rastrigin benchmarks"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Lorenzo Cappellieri" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
